server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml;
  gzip_min_length 1024;

  error_page 404 /404.html;

  # Arquivos com hash do Vite: cache longo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Imagens, vídeos e fontes: cache de 30 dias
  location ~* \.(jpg|jpeg|png|webp|avif|svg|ico|mp4|webm|woff2)$ {
    expires 30d;
    add_header Cache-Control "public";
  }

  # HTML, sitemap e robots sempre revalidados
  location ~* \.(html|xml|txt)$ {
    add_header Cache-Control "no-cache";
  }

  # Endereços antigos do Vila Araponga (o site de energia já respondeu por eles)
  location = /lote { return 301 https://solaresincorporadora.com.br/lote.html$is_args$args; }
  location = /lote.html { return 301 https://solaresincorporadora.com.br/lote.html$is_args$args; }

  location = / {
    try_files /index.html =404;
  }

  # Sem fallback pra SPA: endereço inexistente devolve 404 de verdade
  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}
